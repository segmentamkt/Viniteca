<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15090b">
  <meta name="description" content="La Viniteca — vinos, experiencias y momentos para recordar.">
  <title>La Viniteca</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">

  <style>
    :root{
      --wine:#671322;
      --wine-2:#8d1b2d;
      --cream:#f3eadf;
      --cream-2:#d8c7b2;
      --black:#090706;
      --muted:rgba(243,234,223,.72);
      --line:rgba(243,234,223,.18);
      --safe-top:max(18px, env(safe-area-inset-top));
      --safe-bottom:max(18px, env(safe-area-inset-bottom));
    }

    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--black)}
    body{
      font-family:"DM Sans",sans-serif;
      color:var(--cream);
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
    }
    button,a{font:inherit;color:inherit}
    a{text-decoration:none}
    button{cursor:pointer}

    .landing{
      position:relative;
      width:100%;
      height:100dvh;
      min-height:640px;
      overflow:hidden;
      isolation:isolate;
      background:#0a0706;
    }

    /* VIDEO */
    .video-wrap{
      position:absolute;
      inset:0;
      z-index:-5;
      overflow:hidden;
      background:#0b0706;
    }
    .bg-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      opacity:1;
      transform:scale(1.03);
      transition:opacity .8s ease, transform 8s linear;
      filter:saturate(.9) contrast(1.04) brightness(.78);
    }
    .bg-video.fading{opacity:0}
    .landing.active-motion .bg-video{transform:scale(1.085)}

    /* BRAND COLOR OVERLAYS */
    .overlay{
      position:absolute;
      inset:0;
      z-index:-4;
      background:
        linear-gradient(180deg,rgba(8,6,5,.42) 0%,rgba(8,6,5,.08) 30%,rgba(8,6,5,.20) 55%,rgba(8,6,5,.94) 100%),
        linear-gradient(90deg,rgba(103,19,34,.32) 0%,transparent 55%,rgba(0,0,0,.18) 100%);
      pointer-events:none;
    }
    .wine-glow{
      position:absolute;
      width:360px;
      height:360px;
      right:-150px;
      top:16%;
      z-index:-3;
      border-radius:50%;
      background:radial-gradient(circle,rgba(141,27,45,.30),rgba(103,19,34,.10) 35%,transparent 70%);
      filter:blur(14px);
      animation:floatGlow 7s ease-in-out infinite alternate;
    }
    @keyframes floatGlow{
      from{transform:translate3d(0,-10px,0) scale(.95)}
      to{transform:translate3d(-35px,34px,0) scale(1.12)}
    }

    .grain{
      position:absolute;
      inset:0;
      z-index:-2;
      opacity:.05;
      pointer-events:none;
      mix-blend-mode:soft-light;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
    }

    /* TOP */
    .top{
      position:absolute;
      left:0;right:0;top:0;
      padding:var(--safe-top) 20px 0;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      z-index:10;
    }
    .logo{
      font-family:"Marcellus",serif;
      letter-spacing:.13em;
      font-size:1.25rem;
      line-height:.95;
      text-shadow:0 2px 18px rgba(0,0,0,.5);
    }
    .logo small{
      display:block;
      margin-top:5px;
      font-family:"DM Sans",sans-serif;
      font-size:.44rem;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--cream-2);
    }
    .ig-pill{
      height:38px;
      padding:0 13px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(9,7,6,.28);
      backdrop-filter:blur(12px);
      display:flex;
      align-items:center;
      gap:8px;
      font-size:.72rem;
      font-weight:600;
      box-shadow:0 8px 30px rgba(0,0,0,.18);
    }
    .ig-icon{
      width:18px;height:18px;border:1.6px solid currentColor;border-radius:5px;position:relative;
    }
    .ig-icon:before{
      content:"";position:absolute;width:6px;height:6px;border:1.4px solid currentColor;border-radius:50%;
      left:4.2px;top:4.2px;
    }
    .ig-icon:after{
      content:"";position:absolute;width:2.5px;height:2.5px;background:currentColor;border-radius:50%;
      right:2.6px;top:2.6px;
    }

    /* CONTENT */
    .content{
      position:absolute;
      left:20px;
      right:20px;
      bottom:calc(var(--safe-bottom) + 22px);
      z-index:8;
    }
    .eyebrow{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
      font-size:.65rem;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--cream-2);
    }
    .eyebrow:before{
      content:"";
      width:28px;
      height:1px;
      background:linear-gradient(90deg,var(--wine-2),var(--cream-2));
    }
    h1{
      margin:0;
      max-width:330px;
      font-family:"Marcellus",serif;
      font-size:clamp(3.05rem,14vw,5.25rem);
      font-weight:400;
      line-height:.88;
      letter-spacing:-.035em;
      text-wrap:balance;
      text-shadow:0 10px 38px rgba(0,0,0,.46);
    }
    h1 em{
      display:block;
      font-style:normal;
      color:var(--cream-2);
    }
    .description{
      max-width:340px;
      margin:16px 0 20px;
      color:var(--muted);
      font-size:.88rem;
      line-height:1.55;
      text-shadow:0 2px 18px rgba(0,0,0,.48);
    }

    .ctas{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      max-width:360px;
    }
    .cta{
      min-height:54px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      font-size:.83rem;
      font-weight:700;
      letter-spacing:.015em;
      border:1px solid transparent;
      transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .cta:active{transform:scale(.985)}
    .cta-whatsapp{
      background:linear-gradient(180deg,var(--wine-2),var(--wine));
      box-shadow:0 14px 34px rgba(103,19,34,.34);
    }
    .cta-instagram{
      border-color:var(--line);
      background:rgba(10,7,6,.42);
      backdrop-filter:blur(14px);
    }
    .cta .arrow{
      width:32px;height:32px;border-radius:50%;
      display:grid;place-items:center;
      background:rgba(255,255,255,.09);
      font-size:1rem;
    }

    .meta{
      margin-top:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      max-width:360px;
      color:rgba(243,234,223,.52);
      font-size:.61rem;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    /* VIDEO INDICATOR */
    .video-nav{
      position:absolute;
      right:18px;
      top:50%;
      transform:translateY(-50%);
      z-index:9;
      display:grid;
      gap:9px;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:rgba(243,234,223,.28);
      border:0;
      padding:0;
      transition:.25s ease;
    }
    .dot.active{
      height:26px;
      border-radius:999px;
      background:linear-gradient(180deg,var(--cream-2),var(--wine-2));
    }

    .sound{
      position:absolute;
      right:18px;
      bottom:calc(var(--safe-bottom) + 170px);
      z-index:9;
      width:38px;height:38px;border-radius:50%;
      border:1px solid var(--line);
      background:rgba(9,7,6,.35);
      backdrop-filter:blur(12px);
      display:grid;place-items:center;
      font-size:.85rem;
      transition:.25s ease;
    }
    .sound.audio-on{
      border-color:rgba(216,199,178,.48);
      box-shadow:0 0 0 5px rgba(103,19,34,.10),0 0 28px rgba(103,19,34,.32);
    }

    /* subtle animation */
    .reveal{
      opacity:0;
      transform:translateY(18px);
      animation:reveal .8s .16s ease forwards;
    }
    .reveal.delay-1{animation-delay:.28s}
    .reveal.delay-2{animation-delay:.42s}
    .reveal.delay-3{animation-delay:.54s}
    @keyframes reveal{
      to{opacity:1;transform:none}
    }

    @media(min-width:700px){
      .landing{
        width:min(430px,100%);
        margin:auto;
        box-shadow:0 0 100px rgba(0,0,0,.55);
      }
      body{background:#050403}
    }
  </style>
</head>

<body>
  <main class="landing active-motion" id="landing">
    <div class="video-wrap">
      <video
        class="bg-video"
        id="bgVideo"
        autoplay
        muted
        playsinline
        preload="auto"
        poster=""
      >
        <source src="video-01.mp4" type="video/mp4">
      </video>
    </div>

    <div class="overlay"></div>
    <div class="wine-glow"></div>
    <div class="grain"></div>

    <header class="top">
      <a class="logo reveal" href="#">
        LA VINITECA
        <small>Vino · experiencias · vida</small>
      </a>

      <a
        class="ig-pill reveal delay-1"
        href="https://www.instagram.com/laviniteca.pe/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir Instagram de La Viniteca"
      >
        <span class="ig-icon"></span>
        Instagram
      </a>
    </header>

    <nav class="video-nav" aria-label="Cambiar video">
      <button class="dot active" data-video="0" aria-label="Video 1"></button>
      <button class="dot" data-video="1" aria-label="Video 2"></button>
      <button class="dot" data-video="2" aria-label="Video 3"></button>
    </nav>

    <button class="sound" id="soundBtn" aria-label="Activar ambiente italiano" title="Ambiente italiano">♪</button>

    <section class="content">
      <div class="eyebrow reveal">Selección · experiencia · origen</div>

      <h1 class="reveal delay-1">
        Más que vino.
        <em>Momentos que quedan.</em>
      </h1>

      <p class="description reveal delay-2">
        Descubre etiquetas, destilados y experiencias elegidas para ocasiones que merecen algo especial.
      </p>

      <div class="ctas reveal delay-3">
        <a
          class="cta cta-whatsapp"
          href="https://wa.me/51989039871?text=Hola%20La%20Viniteca%2C%20quiero%20comprar%20y%20recibir%20asesor%C3%ADa."
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>Comprar por WhatsApp</span>
          <span class="arrow">→</span>
        </a>

        <a
          class="cta cta-instagram"
          href="https://www.instagram.com/laviniteca.pe/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>Descubrir en Instagram</span>
          <span class="arrow">↗</span>
        </a>
      </div>

      <div class="meta reveal delay-3">
        <span>+51 989 039 871</span>
        <span>Perú · +18</span>
      </div>
    </section>
  </main>

  <script>
    const videos = [
      "video-01.mp4",
      "video-02.mp4",
      "video-03.mp4"
    ];

    const video = document.getElementById("bgVideo");
    const dots = [...document.querySelectorAll(".dot")];
    const soundBtn = document.getElementById("soundBtn");
    let current = 0;
    let switching = false;

    function updateDots(){
      dots.forEach((dot,i)=>dot.classList.toggle("active", i === current));
    }

    function playVideo(index){
      if(switching) return;
      switching = true;
      current = index;

      video.classList.add("fading");

      setTimeout(()=>{
        video.src = videos[current];
        video.load();

        const promise = video.play();
        if (promise) promise.catch(()=>{});

        video.classList.remove("fading");
        updateDots();
        switching = false;
      }, 420);
    }

    video.addEventListener("ended", ()=>{
      playVideo((current + 1) % videos.length);
    });

    dots.forEach((dot,i)=>{
      dot.addEventListener("click", ()=>playVideo(i));
    });

    // Ambiente musical italiano original, generado en el navegador.
    // Los videos permanecen silenciados para que no compitan con la música.
    let audioCtx = null;
    let masterGain = null;
    let musicTimer = null;
    let ambienceOn = false;
    let step = 0;

    const italianProgression = [
      [57, 60, 64], // Am
      [53, 57, 60], // F
      [55, 59, 62], // G
      [52, 56, 59]  // E
    ];

    function midiToFreq(midi){
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function pluck(freq, when, gain=0.045, duration=0.42){
      const osc = audioCtx.createOscillator();
      const overtone = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = "triangle";
      overtone.type = "sine";
      osc.frequency.setValueAtTime(freq, when);
      overtone.frequency.setValueAtTime(freq * 2.01, when);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1700, when);
      filter.Q.setValueAtTime(0.7, when);

      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(gain, when + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, when + duration);

      osc.connect(filter);
      overtone.connect(filter);
      filter.connect(g);
      g.connect(masterGain);

      osc.start(when);
      overtone.start(when);
      osc.stop(when + duration + 0.05);
      overtone.stop(when + duration + 0.05);
    }

    function warmPad(notes, when, duration=2.8){
      notes.forEach((midi, i)=>{
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = i === 0 ? "triangle" : "sine";
        osc.frequency.setValueAtTime(midiToFreq(midi - 12), when);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(620, when);

        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(0.016, when + 0.35);
        g.gain.exponentialRampToValueAtTime(0.0001, when + duration);

        osc.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        osc.start(when);
        osc.stop(when + duration + 0.1);
      });
    }

    function scheduleItalianPhrase(){
      if(!ambienceOn || !audioCtx) return;

      const now = audioCtx.currentTime + 0.05;
      const chord = italianProgression[step % italianProgression.length];
      warmPad(chord, now, 3.1);

      // Mandolina/guitarra suave en 6/8, elegante y lenta.
      const arp = [
        chord[0] + 12,
        chord[1] + 12,
        chord[2] + 12,
        chord[1] + 12,
        chord[0] + 12,
        chord[2] + 12
      ];

      arp.forEach((midi, i)=>{
        pluck(midiToFreq(midi), now + i * 0.34, i % 3 === 0 ? 0.052 : 0.037, 0.38);
      });

      // Pequeña nota melódica superior para sensación cinematográfica italiana.
      const melody = [76, 74, 72, 71][step % 4];
      pluck(midiToFreq(melody), now + 1.72, 0.024, 0.65);

      step++;
    }

    function startItalianAmbience(){
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.68;
        masterGain.connect(audioCtx.destination);
      }

      if(audioCtx.state === "suspended") audioCtx.resume();

      ambienceOn = true;
      step = 0;
      scheduleItalianPhrase();
      musicTimer = setInterval(scheduleItalianPhrase, 2300);

      video.muted = true;
      soundBtn.textContent = "♫";
      soundBtn.setAttribute("aria-label", "Silenciar ambiente italiano");
      soundBtn.title = "Ambiente italiano activo";
      soundBtn.classList.add("audio-on");
    }

    function stopItalianAmbience(){
      ambienceOn = false;
      if(musicTimer){
        clearInterval(musicTimer);
        musicTimer = null;
      }
      if(masterGain && audioCtx){
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);
        setTimeout(()=>{
          if(masterGain) masterGain.gain.value = 0.68;
        }, 350);
      }
      soundBtn.textContent = "♪";
      soundBtn.setAttribute("aria-label", "Activar ambiente italiano");
      soundBtn.title = "Ambiente italiano";
      soundBtn.classList.remove("audio-on");
    }

    soundBtn.addEventListener("click", ()=>{
      ambienceOn ? stopItalianAmbience() : startItalianAmbience();
    });

    document.addEventListener("visibilitychange", ()=>{
      if(document.hidden){
        video.pause();
      }else{
        video.play().catch(()=>{});
      }
    });

    // iOS fallback: ensure autoplay remains muted/playsinline.
    window.addEventListener("load", ()=>{
      video.muted = true;
      video.play().catch(()=>{});
    });
  </script>
</body>
</html>
